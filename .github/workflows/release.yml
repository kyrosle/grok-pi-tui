name: Release grok-pi (macOS Apple Silicon)

# Local builds are published directly to an existing v* tag. Use this workflow
# explicitly when a hosted rebuild is wanted; tag pushes do not rebuild assets.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag (vX.Y.Z or vX.Y.Z-beta.N)"
        required: true
        type: string

permissions:
  contents: write

env:
  GROK_PI_RELEASE_TAG: ${{ inputs.tag }}

jobs:
  release:
    runs-on: macos-14
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.GROK_PI_RELEASE_TAG }}

      - name: Validate version and changelog
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GROK_PI_RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-beta\.[0-9]+)?$ ]]
          echo "GROK_PI_VERSION=${GROK_PI_RELEASE_TAG#v}" >> "$GITHUB_ENV"
          python3 scripts/extract-changelog-section.py --self-test
          python3 scripts/extract-changelog-section.py "${GROK_PI_RELEASE_TAG#v}" CHANGELOG.MD --strict

      - uses: dtolnay/rust-toolchain@1.94.0

      - uses: Swatinem/rust-cache@v2
        with:
          cache-workspace-crates: true
          cache-on-failure: false
          prefix-key: v5-pi-macos

      - name: Install protoc
        run: brew install protobuf

      - name: Build production binary
        env:
          CARGO_PROFILE_RELEASE_DIST_CODEGEN_UNITS: "16"
          CARGO_PROFILE_RELEASE_DIST_LTO: "off"
          CARGO_PROFILE_RELEASE_DIST_DEBUG: "0"
        run: |
          ./scripts/cargo-shared.sh build --locked --profile release-dist \
            -p xai-grok-pager-bin --bin grok-pi \
            --no-default-features --features release-dist,jemalloc,sandbox-enforce

      - name: Package and verify
        run: |
          set -euo pipefail
          python3 scripts/package-macos.py target/release-dist/grok-pi dist/grok-pi-macos-aarch64.tar.gz
          cp install.sh dist/
          curl -fL --retry 3 --max-time 120 https://ftp.gnu.org/pub/gnu/libiconv/libiconv-1.17.tar.gz -o dist/libiconv-1.17.tar.gz
          curl -fL --retry 3 --max-time 120 https://zlib.net/fossils/zlib-1.3.1.tar.gz -o dist/zlib-1.3.1.tar.gz
          (cd dist && shasum -a 256 grok-pi-macos-aarch64.tar.gz install.sh libiconv-1.17.tar.gz zlib-1.3.1.tar.gz > SHA256SUMS)
          python3 scripts/extract-changelog-section.py "$GROK_PI_VERSION" CHANGELOG.MD \
            --strict --with-install --repo "$GITHUB_REPOSITORY" -o dist/release-notes.md

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.GROK_PI_RELEASE_TAG }}
          prerelease: ${{ contains(env.GROK_PI_RELEASE_TAG, '-beta.') }}
          generate_release_notes: false
          body_path: dist/release-notes.md
          files: |
            dist/grok-pi-macos-aarch64.tar.gz
            dist/install.sh
            dist/SHA256SUMS
            dist/libiconv-1.17.tar.gz
            dist/zlib-1.3.1.tar.gz
