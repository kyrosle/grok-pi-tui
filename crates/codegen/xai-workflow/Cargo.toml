[package]
license = "Apache-2.0"
name = "xai-workflow"
version = "0.1.0"
edition.workspace = true
description = "Rhai-scripted dynamic workflow engine: scripts orchestrate agents through a host channel"

[dependencies]
dunce = { workspace = true }
jsonschema = { workspace = true }
parking_lot = { workspace = true }
uuid = { workspace = true, features = ["v7"] }
chrono = { workspace = true }
async-trait = { workspace = true }
xai-tool-types = { workspace = true }
xai-tty-utils = { workspace = true }
tempfile = { workspace = true }
rhai = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
sha2 = { workspace = true }
strum = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["sync", "rt", "process", "time", "macros"] }
tokio-util = { workspace = true }
tracing = { workspace = true }

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["full"] }

[lints]
workspace = true
